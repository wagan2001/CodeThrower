[package]
name = "codethrower"
version = "0.1.0"
description = "A local coding dojo coach powered by an Ollama development runtime."
authors = ["CodeThrower"]
edition = "2021"

[lib]
name = "codethrower_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
